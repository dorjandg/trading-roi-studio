<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P4 Reverse Cost Calculator — Demo</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#edf4ff;font:15px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:24px 16px}h1{font-size:26px;margin:8px 0}p{color:#a9b8cd}section{background:#141f31;border:1px solid #2a3a51;border-radius:15px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:block;font-size:13px;color:#bdcbe0;margin-bottom:5px}input{width:100%;background:#0b1424;border:1px solid #3c506c;border-radius:9px;color:white;padding:12px;font:inherit}table{width:100%;border-collapse:collapse}td,th{padding:12px 6px;border-bottom:1px solid #2c3a50;text-align:right}td:first-child,th:first-child{text-align:left}.big{font-size:32px;font-weight:750;color:#6ee7b7}.muted{font-size:12px;color:#a9b8cd}button{background:#247a61;color:white;border:0;border-radius:9px;padding:12px 18px;cursor:pointer}@media(max-width:420px){.grid{gap:10px}section{padding:13px}h1{font-size:23px}}main{max-width:900px;padding:10px 12px}h1{font-size:19px;margin:2px 0 4px}main>p{font-size:12px;margin:3px 0 8px}section{padding:10px;margin:8px 0;border-radius:10px}.grid{gap:7px}label{font-size:11px;margin-bottom:3px}input{padding:7px 9px;font-size:13px;border-radius:6px}.big{font-size:22px}h2{font-size:14px;margin:0 0 8px}p{margin:5px 0;font-size:12px}td,th{padding:6px 4px;font-size:12px}.muted{font-size:10px}button{padding:8px 12px;font-size:12px}#dashboard{grid-template-columns:repeat(5,minmax(0,1fr))}#dashboard>div{padding:8px!important}#dashboard>div>div{font-size:16px!important;overflow-wrap:anywhere}@media(max-width:650px){main{padding:7px}h1{font-size:17px}section{padding:8px;margin:6px 0}.grid{gap:6px}#dashboard{grid-template-columns:repeat(3,minmax(0,1fr))}#dashboard>div{padding:7px!important}#dashboard>div>div{font-size:15px!important}input{padding:6px}td,th{font-size:11px;padding:5px 3px}}@media(max-width:380px){#dashboard{grid-template-columns:repeat(2,minmax(0,1fr))}} </style></head><body><main><h1>P4 Reverse Cost Calculator</h1><p>Reverse pass rates · Fees · Withdrawal · Net ROI</p><section><label>RESULTS DASHBOARD</label><div class="grid" id="dashboard"></div></section><section><h2>Inputs</h2><div class="grid"><div><label for="target">Target P4 accounts</label><input id="target" type="number" min="0" step="1" value="1"></div><div><label for="r1">P1 pass rate (%)</label><input id="r1" type="number" min="0.01" max="100" step=".1" value="50"></div><div><label for="r2">P2 pass rate (%)</label><input id="r2" type="number" min="0.01" max="100" step=".1" value="50"></div><div><label for="r3">P3 pass rate (%)</label><input id="r3" type="number" min="0.01" max="100" step=".1" value="30"></div><div><label for="c1">P1 evaluation fee ($)</label><input id="c1" type="number" min="0" step=".01" value="50"></div><div><label for="c3">P3 activation fee ($)</label><input id="c3" type="number" min="0" step=".01" value="150"></div><div><label for="withdrawal">Gross withdrawal per P4 ($)</label><input id="withdrawal" type="number" min="0" step=".01" value="3500"></div><div><label for="split">Your payout split (%)</label><input id="split" type="number" min="0" max="100" step=".1" value="75"></div></div></section><section><h2>Calculation details</h2><label>Expected total cost</label><div class="big" id="total">$1,166.67</div><p id="unit"></p><table><thead><tr><th>Stage</th><th>Expected accounts</th><th>Cost</th></tr></thead><tbody id="rows"></tbody></table><p class="muted">Expected values; not guaranteed. P3 activation charged per entry.</p><button id="copy">Copy summary</button></section></main><script>const ids=['target','r1','r2','r3','c1','c3','withdrawal','split'];const el=id=>document.getElementById(id);const fmt=n=>Number.isFinite(n)?n.toLocaleString('en-US',{maximumFractionDigits:2}):'—';const usd=n=>Number.isFinite(n)?n.toLocaleString('en-US',{style:'currency',currency:'USD'}):'—';let summary='';function calc(){let [t,a,b,c,f,g,w,s]=ids.map(id=>Number(el(id).value));if(![t,a,b,c,f,g].every(Number.isFinite)||t<0||a<=0||b<=0||c<=0||a>100||b>100||c>100||f<0||g<0||w<0||s<0||s>100){el('total').textContent='Check inputs';el('rows').innerHTML='';el('unit').textContent='Pass rates must be above 0% and at most 100%.';return}let p3=t/(c/100),p2=p3/(b/100),p1=p2/(a/100),v1=p1*f,v3=p3*g,total=v1+v3;let gross=t*w,income=gross*s/100,net=income-total,roi=total>0?net/total*100:null;el('dashboard').innerHTML=[['Gross withdrawal',gross],['Your income (after split)',income],['Total costs',total],['Net profit',net],['Net ROI',roi===null?'—':fmt(roi)+'%']].map(([label,value])=>'<div style="padding:14px;background:#0b1424;border-radius:10px"><label>'+label+'</label><div style="font-size:22px;font-weight:700;color:'+(label==='Net profit'?(net>=0?'#6ee7b7':'#fb7185'):'#edf4ff')+'">'+(typeof value==='number'?usd(value):value)+'</div></div>').join('');el('total').textContent=usd(total);el('unit').textContent='Expected cost per P4 success: '+(t?usd(total/t):'—');el('rows').innerHTML=[['P1 evaluations',p1,usd(v1)],['P2 passed P1',p2,usd(0)],['P3 activations',p3,usd(v3)],['P4 successes',t,'—']].map(row=>'<tr><td>'+row[0]+'</td><td>'+fmt(row[1])+'</td><td>'+row[2]+'</td></tr>').join('');summary='Target P4: '+fmt(t)+'; expected P1: '+fmt(p1)+'; P2: '+fmt(p2)+'; P3: '+fmt(p3)+'; evaluation cost: '+usd(v1)+'; activation cost: '+usd(v3)+'; total: '+usd(total)+'; gross withdrawal: '+usd(gross)+'; received income: '+usd(income)+'; net profit: '+usd(net)}ids.forEach(id=>el(id).addEventListener('input',calc));el('copy').addEventListener('click',()=>navigator.clipboard.writeText(summary).then(()=>{el('copy').textContent='Copied!'}));calc();</script></body></html>
