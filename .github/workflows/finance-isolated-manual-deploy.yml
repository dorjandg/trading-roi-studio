name: Finance isolated Workers manual deploy
on:
  workflow_dispatch:
    inputs:
      confirm_isolated_only:
        description: "Type ISOLATED-ONLY to deploy the two test Workers"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: finance-isolated-deploy
  cancel-in-progress: false
jobs:
  deploy-isolated:
    if: ${{ github.ref == 'refs/heads/feature/finance-approved-corrections' && inputs.confirm_isolated_only == 'ISOLATED-ONLY' }}
    runs-on: ubuntu-latest
    environment: finance-isolated-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check required Cloudflare credential and isolated database ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing Cloudflare API token"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing Cloudflare account ID"; exit 1; }
          grep -q 'c17bd16f-ff73-4b53-b8a5-5128d9d1b400' workers/finance-correction-api-isolated/wrangler.isolated.jsonc
          grep -q '"workers_dev": false' workers/finance-correction-api-isolated/wrangler.isolated.jsonc
          grep -q '"workers_dev": false' workers/finance-mcp-gateway-stage/wrangler.isolated.jsonc
          grep -q '"FINANCE_MCP_WRITE_TOOLS_ENABLED": "false"' workers/finance-mcp-gateway-stage/wrangler.isolated.jsonc
          grep -q '"FINANCE_MCP_DIRECT_WRITE_ENABLED": "false"' workers/finance-correction-api-isolated/wrangler.isolated.jsonc
      - name: Verify code syntax and fail-closed tests
        run: |
          node --check functions/api/finance.js
          node --check workers/finance-correction-api-isolated/index.mjs
          node --check workers/finance-mcp-gateway-stage/correction-mcp-router.mjs
          node workers/finance-mcp-gateway-stage/test/correction-mcp-router.test.mjs
          node workers/finance-mcp-gateway-stage/test/correction-ticket.test.mjs
          node workers/finance-mcp-gateway-stage/test/correction-api-integration.test.cjs
      - name: Deploy isolated API Worker (no public routes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config workers/finance-correction-api-isolated/wrangler.isolated.jsonc
      - name: Deploy isolated MCP Worker (write tools disabled, no public routes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config workers/finance-mcp-gateway-stage/wrangler.isolated.jsonc
