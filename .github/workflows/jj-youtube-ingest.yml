name: JJ Academy YouTube caption ingestion

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum new transcript attempts (1-67)"
        required: false
        default: "10"
      video_id:
        description: "Optional exact YouTube ID from JJ Simon sheet"
        required: false
        default: ""
      dry_run:
        description: "Validate both Google Sheets only, no transcript API requests"
        type: boolean
        default: false
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: read

concurrency:
  group: jj-academy-youtube-ingest
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Skip scheduled request until hosted API key exists
        id: gate
        env:
          JJ_SUPADATA_API_KEY: ${{ secrets.JJ_SUPADATA_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -z "$JJ_SUPADATA_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Hosted caption API not configured; safe skip."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          ref: jj-simon-knowledge-hub

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.12"

      - name: Install Google Sheets client
        if: steps.gate.outputs.enabled == 'true'
        run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.0,<3' 'google-auth>=2.0,<3'

      - name: Import available native captions into private owner-owned Google Sheet
        if: steps.gate.outputs.enabled == 'true'
        env:
          JJ_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.JJ_GOOGLE_SERVICE_ACCOUNT_JSON }}
          JJ_SUPADATA_API_KEY: ${{ secrets.JJ_SUPADATA_API_KEY }}
          JJ_LIMIT: ${{ github.event.inputs.limit || '10' }}
          JJ_VIDEO_ID: ${{ github.event.inputs.video_id || '' }}
          JJ_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          args=(--limit "$JJ_LIMIT")
          if [ -n "$JJ_VIDEO_ID" ]; then args+=(--video-id "$JJ_VIDEO_ID"); fi
          if [ "$JJ_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python jj-simon/automation/import-supadata-to-sheets.py "${args[@]}"
