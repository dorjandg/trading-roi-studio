name: JJ Academy YouTube caption ingestion

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum new caption fetch attempts (1–67)"
        required: false
        default: "10"
      video_id:
        description: "Optional 11-character YouTube ID from the JJ Simon tab"
        required: false
        default: ""
      dry_run:
        description: "Validate live sheet only; no caption download"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: read

concurrency:
  group: jj-academy-youtube-ingest
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ vars.JJ_YOUTUBE_INGEST_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded dependencies
        run: |
          python -m pip install --disable-pip-version-check 'yt-dlp>=2026.9.1' 'google-api-python-client>=2.0,<3' 'google-auth>=2.0,<3'
      - name: Validate configuration
        env:
          JJ_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.JJ_GOOGLE_SERVICE_ACCOUNT_JSON }}
          JJ_TRANSCRIPTS_DRIVE_FOLDER_ID: ${{ secrets.JJ_TRANSCRIPTS_DRIVE_FOLDER_ID }}
          JJ_SUPADATA_API_KEY: ${{ secrets.JJ_SUPADATA_API_KEY }}
        run: |
          test -n "$JJ_GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "::error::Missing JJ_GOOGLE_SERVICE_ACCOUNT_JSON secret"; exit 1; }
          if [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
            test -n "$JJ_TRANSCRIPTS_DRIVE_FOLDER_ID" || { echo "::error::Missing private JJ_TRANSCRIPTS_DRIVE_FOLDER_ID secret"; exit 1; }
            test -n "$JJ_SUPADATA_API_KEY" || { echo "::error::Hosted transcript provider key JJ_SUPADATA_API_KEY is not configured; GitHub yt-dlp fallback intentionally disabled"; exit 1; }
          fi
      - name: Read JJ Sheet and import captions into private Drive
        env:
          JJ_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.JJ_GOOGLE_SERVICE_ACCOUNT_JSON }}
          JJ_TRANSCRIPTS_DRIVE_FOLDER_ID: ${{ secrets.JJ_TRANSCRIPTS_DRIVE_FOLDER_ID }}
          JJ_SUPADATA_API_KEY: ${{ secrets.JJ_SUPADATA_API_KEY }}
          JJ_LIMIT: ${{ github.event.inputs.limit || '10' }}
          JJ_VIDEO_ID: ${{ github.event.inputs.video_id || '' }}
          JJ_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          args=(--limit "$JJ_LIMIT")
          if [ -n "$JJ_VIDEO_ID" ]; then args+=(--video-id "$JJ_VIDEO_ID"); fi
          if [ "$JJ_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python jj-simon/automation/import-youtube-captions.py "${args[@]}"
