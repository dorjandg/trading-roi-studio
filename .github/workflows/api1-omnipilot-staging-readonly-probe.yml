name: OmniPilot staging public OAuth and MCP read-only probe
on:
  push:
    branches:
      - api1-browser-interaction-phase1
    paths:
      - ".github/workflows/api1-omnipilot-staging-readonly-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe public discovery and OAuth protection (no secrets or writes)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base='https://cloud-browser-chatgpt-stage.dorjan-gjoni-dg.workers.dev';
          const rpc=(method,id,params={})=>JSON.stringify({jsonrpc:'2.0',id,method,params});
          const request=async(label,path,body)=>{
            let response;
            try{response=await fetch(base+path,{
              method:body===undefined?'GET':'POST',
              headers:body===undefined?{}:{'content-type':'application/json',
                'accept':'application/json, text/event-stream'},
              ...(body===undefined?{}:{body}),redirect:'manual',
              signal:AbortSignal.timeout(18000)
            });}catch{console.log(label+': UNREACHABLE');return null;}
            let data=null;
            try{const raw=await response.text();if(raw.length<60000)data=JSON.parse(raw);}catch{}
            console.log(label+': HTTP '+response.status);
            return {status:response.status,data};
          };
          const init=await request('PUBLIC_INITIALIZE','/mcp',
            rpc('initialize',1,{protocolVersion:'2025-06-18',capabilities:{},
              clientInfo:{name:'omnipilot-stage-probe',version:'1'}}));
          const tools=await request('PUBLIC_TOOLS_LIST','/mcp',rpc('tools/list',2));
          const denied=await request('TOOL_CALL_REQUIRES_OAUTH','/mcp',
            rpc('tools/call',3,{name:'browser_agent_status',arguments:{}}));
          const auth=await request('OAUTH_METADATA','/.well-known/oauth-authorization-server');
          const resource=await request('RESOURCE_METADATA','/.well-known/oauth-protected-resource/mcp');
          const passed=[
            init?.status===200&&!!init.data?.result?.serverInfo?.name,
            tools?.status===200&&Array.isArray(tools.data?.result?.tools),
            denied?.status===401,
            auth?.status===200&&!!auth.data?.issuer,
            resource?.status===200&&!!resource.data?.resource
          ];
          console.log('PUBLIC_MCP_ACCEPTANCE: '+passed.filter(Boolean).length+'/'+passed.length);
          console.log('DISCOVERED_TOOLS_COUNT: '+(tools?.data?.result?.tools?.length??0));
          if(!passed.every(Boolean))process.exitCode=1;
          NODE
