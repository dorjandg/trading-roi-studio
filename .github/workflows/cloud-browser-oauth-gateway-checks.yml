name: Cloud Browser Agent — OAuth Gateway Safety Checks
on:
  push:
    branches:
      - feature/cloud-browser-agent-phase1
    paths:
      - "workers/cloud-browser-chatgpt-gateway/**"
      - ".github/workflows/cloud-browser-oauth-gateway-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.ref == 'refs/heads/feature/cloud-browser-agent-phase1'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    defaults:
      run:
        working-directory: workers/cloud-browser-chatgpt-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned OAuth dependencies
        run: npm install --no-audit --no-fund
      - name: Validate OAuth gateway source
        run: npm run check
      - name: Verify auth, scope, URL and consent security
        run: npm test
      - name: Confirm gateway has no active Wrangler deployment config
        run: |
          if test -f wrangler.jsonc || test -f wrangler.toml; then
            echo "::error::OAuth gateway must remain without an active deploy config until login credentials exist."
            exit 1
          fi
