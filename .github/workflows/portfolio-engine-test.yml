name: Portfolio engine regression
on:
  push:
    paths:
      - 'portfolio-engine.js'
      - 'tests/portfolio-engine.test.cjs'
      - 'tests/run-portfolio-simulation.cjs'
      - '.github/workflows/portfolio-engine-test.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/portfolio-engine.test.cjs
      - run: node tests/run-portfolio-simulation.cjs --fixture --assert-payout --output portfolio-test-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-engine-test-report
          path: portfolio-test-report.json
          if-no-files-found: ignore
