name: API1 isolated OAuth-subject grant and revocation security
on:
  push:
    branches:
      - api1-browser-interaction-phase1
    paths:
      - ".github/workflows/api1-omnipilot-subject-grants.yml"
      - "workers/cloud-browser-chatgpt-gateway/src/omnipilot-subject-*.mjs"
      - "workers/cloud-browser-chatgpt-gateway/src/omnipilot-operator-*.mjs"
      - "workers/cloud-browser-chatgpt-gateway/src/omnipilot-revocation-*.mjs"
      - "workers/cloud-browser-chatgpt-gateway/test/omnipilot-subject-*.test.mjs"
      - "workers/cloud-browser-chatgpt-gateway/test/omnipilot-operator-*.test.mjs"
      - "workers/cloud-browser-chatgpt-gateway/test/omnipilot-revocation-*.test.mjs"
      - "workers/cloud-browser-chatgpt-gateway/migrations/0001_omnipilot_subject_grants.sql"
      - "workers/cloud-browser-chatgpt-gateway/test/omnipilot_subject_sqlite_test.py"
      - "workers/cloud-browser-agent/src/omnipilot-site-grants.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  subject-grant-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate OAuth subject and grant lifecycle modules
        working-directory: workers/cloud-browser-chatgpt-gateway
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          node --check src/omnipilot-subject-authority.mjs
          node --check src/omnipilot-subject-ledger.mjs
          node --check src/omnipilot-subject-store.mjs
          node --check src/omnipilot-operator-proof.mjs
          node --check src/omnipilot-revocation-fence.mjs
          node --test test/omnipilot-subject-authority.test.mjs test/omnipilot-subject-ledger.test.mjs test/omnipilot-subject-store.test.mjs test/omnipilot-operator-proof.test.mjs test/omnipilot-revocation-fence.test.mjs
      - name: Prove grant CAS, append-only audit and revocation in isolated SQLite memory
        working-directory: workers/cloud-browser-chatgpt-gateway
        run: |
          python3 -B -m unittest discover -s test -p 'omnipilot_subject_sqlite_test.py' -v
      - name: Confirm legacy OAuth tests and protected Worker dry-run build
        working-directory: workers/cloud-browser-chatgpt-gateway
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npm run check
          node --test test/omnipilot-site-oauth.test.mjs test/omnipilot-gateway-pilot.test.mjs
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/omnipilot-subject-gateway-only"
      - name: Prevent unreviewed gateway wiring or new live D1 bindings
        shell: bash
        run: |
          set -euo pipefail
          if grep -E 'omnipilot-(subject|operator|revocation)-(authority|ledger|store|proof|fence)' \
            workers/cloud-browser-chatgpt-gateway/src/index.mjs \
            workers/cloud-browser-chatgpt-gateway/src/forward.mjs; then
            echo "UNREVIEWED_SUBJECT_GRANT_WIRING_REFUSED"
            exit 1
          fi
          if grep -q 'OMNIPILOT_GRANT_DB' \
            workers/cloud-browser-chatgpt-gateway/wrangler.jsonc; then
            echo "UNREVIEWED_SUBJECT_D1_BINDING_REFUSED"
            exit 1
          fi
          test -d "$RUNNER_TEMP/omnipilot-subject-gateway-only"
          echo "OMNIPILOT_SUBJECT_GRANTS_ISOLATED_SYNTHETIC_ONLY"
