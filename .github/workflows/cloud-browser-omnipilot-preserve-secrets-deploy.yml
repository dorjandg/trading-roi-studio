name: OmniPilot OAuth scoped public-demo staging activation
on:
  push:
    branches:
      - feature/cloud-browser-agent-phase1
    paths:
      - ".github/workflows/cloud-browser-omnipilot-preserve-secrets-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-browser-chatgpt-stage-code-only-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/feature/cloud-browser-agent-phase1' &&
      vars.CLOUD_BROWSER_OAUTH_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: browser-agent-staging
    timeout-minutes: 12
    defaults:
      run:
        working-directory: workers/cloud-browser-chatgpt-gateway
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require established browser-agent Access readiness
        shell: bash
        run: |
          if [[ "${{ vars.BROWSER_AGENT_ACCESS_READY }}" != 'true' ]]; then
            echo 'STAGING_ACCESS_READINESS_NOT_APPROVED'
            exit 1
          fi
      - name: Install dependencies and run all existing source/auth checks
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test
          npm run build
      - name: Verify deployed staging OAuth secrets exist without reading their values
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const name='cloud-browser-chatgpt-stage';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!account||!token)throw Error('CLOUDFLARE_STAGING_AUTH_UNAVAILABLE');
          const res=await fetch('https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account)+'/workers/scripts/'+name+'/settings',{
            headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(15000)});
          if(!res.ok)throw Error('STAGING_BINDINGS_UNREADABLE_HTTP_'+res.status);
          const data=await res.json(),bindings=data.result?.bindings;
          if(!Array.isArray(bindings))throw Error('STAGING_BINDINGS_UNREADABLE');
          const byName=new Map(bindings.map(b=>[b.name,b]));
          const required={BROWSER_AGENT_API_TOKEN:'secret_text',
            CF_ACCESS_CLIENT_ID:'secret_text',CF_ACCESS_CLIENT_SECRET:'secret_text',
            GOOGLE_CLIENT_ID:'secret_text',GOOGLE_CLIENT_SECRET:'secret_text',
            GOOGLE_ALLOWED_EMAIL:'plain_text',OAUTH_KV:'kv_namespace'};
          for(const [key,type] of Object.entries(required))
            if(byName.get(key)?.type!==type)throw Error('STAGING_BINDING_REQUIRED_'+key);
          if(typeof byName.get('GOOGLE_ALLOWED_EMAIL')?.text!=='string'||
              byName.get('GOOGLE_ALLOWED_EMAIL').text.length<3)
            throw Error('STAGING_GOOGLE_ALLOWLIST_MISSING');
          const summarize=()=>({
            names:bindings.filter(b=>b.name!=='OMNIPILOT_MANAGED_PILOT_ENABLED').map(b=>b.name+':'+b.type).sort(),
            allowedEmailHash:createHash('sha256').update(byName.get('GOOGLE_ALLOWED_EMAIL').text).digest('hex'),
            oauthKvNamespace:byName.get('OAUTH_KV').namespace_id
          });
          const snapshot=summarize();
          await writeFile(process.env.RUNNER_TEMP+'/omnipilot-stage-baseline.json',
            JSON.stringify(snapshot),{mode:0o600});
          console.log('EXISTING_OAUTH_SECRETS_AND_KV_VERIFIED');
          NODE
      - name: Enable separately consented demo tool while preserving OAuth secrets and vars
        run: npx wrangler deploy --keep-vars --var "OMNIPILOT_MANAGED_PILOT_ENABLED:true"
      - name: Verify bindings preserved and public MCP still rejects unauthorized actions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const name='cloud-browser-chatgpt-stage';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account)+'/workers/scripts/'+name+'/settings',{
            headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(15000)});
          if(!r.ok)throw Error('STAGING_BINDINGS_POSTCHECK_HTTP_'+r.status);
          const data=await r.json(),bindings=data.result?.bindings;
          if(!Array.isArray(bindings))throw Error('POST_DEPLOY_BINDINGS_UNREADABLE');
          const before=JSON.parse(await readFile(process.env.RUNNER_TEMP+'/omnipilot-stage-baseline.json','utf8'));
          const byName=new Map(bindings.map(b=>[b.name,b]));
          const after={
            names:bindings.filter(b=>b.name!=='OMNIPILOT_MANAGED_PILOT_ENABLED').map(b=>b.name+':'+b.type).sort(),
            allowedEmailHash:createHash('sha256').update(byName.get('GOOGLE_ALLOWED_EMAIL')?.text||'').digest('hex'),
            oauthKvNamespace:byName.get('OAUTH_KV')?.namespace_id
          };
          if(JSON.stringify(before)!==JSON.stringify(after))
            throw Error('STAGING_BINDINGS_CHANGED_OR_LOST');
          const enabled=byName.get('OMNIPILOT_MANAGED_PILOT_ENABLED');
          if(enabled?.type!=='plain_text'||enabled.text!=='true')
            throw Error('STAGING_PILOT_FLAG_NOT_SET');
          const base='https://'+name+'.dorjan-gjoni-dg.workers.dev';
          const rpc=(id,method,params={})=>JSON.stringify({jsonrpc:'2.0',id,method,params});
          const p=async(body)=>fetch(base+'/mcp',{method:'POST',headers:{'content-type':'application/json',
            accept:'application/json, text/event-stream'},body,redirect:'manual',signal:AbortSignal.timeout(15000)});
          const init=await p(rpc(1,'initialize',{protocolVersion:'2025-06-18',capabilities:{},
            clientInfo:{name:'omnipilot-deploy-acceptance',version:'1'}}));
          if(init.status!==200)throw Error('MCP_INITIALIZE_REGRESSION');
          const list=await p(rpc(2,'tools/list'));
          if(list.status!==200)throw Error('MCP_DISCOVERY_REGRESSION');
          const tools=(await list.json()).result?.tools;
          const pilot=tools?.find(t=>t.name==='omnipilot_managed_demo');
          if(!Array.isArray(tools)||tools.length!==7||!pilot||
             pilot.annotations?.readOnlyHint!==false||
             !pilot._meta?.securitySchemes?.[0]?.scopes?.includes('mcp:demo.interact')||
             !pilot._meta?.securitySchemes?.[0]?.scopes?.includes('mcp:read')||
             tools.filter(t=>t.name!==pilot.name).some(t=>t.annotations?.readOnlyHint!==true))
            throw Error('SCOPED_PUBLIC_DEMO_DISCOVERY_INVALID');
          const unauthorized=await p(rpc(3,'tools/call',{name:'omnipilot_managed_demo',arguments:{
            url:'https://demo.playwright.dev/todomvc/',actions:[{op:'click',selector:'body'}]}}));
          if(unauthorized.status!==401)throw Error('MCP_AUTH_REGRESSION');
          console.log('OAUTH_PILOT_SCOPE_ACCEPTED: secrets preserved; six read-only tools; one separately scoped demo tool; unauthorized rejected');
          NODE

# Revalidate and deploy granular site-read OAuth code with the new site tool flag OFF.
