name: Finance Control API checks
on:
  pull_request:
    paths:
      - 'functions/api/finance.js'
      - 'tests/finance-control.test.cjs'
      - '.github/workflows/finance-control-checks.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check API syntax
        run: node --check functions/api/finance.js
      - name: Run control API tests
        run: node --test tests/finance-control.test.cjs
