name: Finance Hub checks
on:
  push:
    paths:
      - 'finance/**'
      - '.github/workflows/finance-hub-checks.yml'
  pull_request:
    paths:
      - 'finance/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finance Hub source and financial fixture tests
        run: node finance/test.cjs
