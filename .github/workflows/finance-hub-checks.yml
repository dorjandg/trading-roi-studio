name: Finance Hub checks
on:
  push:
    paths:
      - 'finance/**'
      - '.github/workflows/finance-hub-checks.yml'
  pull_request:
    paths:
      - 'finance/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finance Hub source and financial fixture tests
        run: node finance/test.cjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Finance Hub browser smoke test
        run: npx playwright test finance/browser.spec.cjs --browser=chromium --reporter=line
