name: API1 isolated security validation
on:
  push:
    branches:
      - api1-browser-agent-release-candidate
      - api1-browser-interaction-phase1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium test dependencies
        working-directory: workers/cloud-browser-agent
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 miniflare@3
      - name: Run Node tests
        working-directory: workers/cloud-browser-agent
        run: npm test
      - name: Check security policy and syntax
        working-directory: workers/cloud-browser-agent
        run: |
          node --check src/handler.mjs
          node --check src/policy.mjs
          node --check src/mcp.mjs
          node --check src/interaction-policy.mjs
          node --check simulation/interaction-executor.mjs
          node --check simulation/browser-interaction-adapter.mjs
          node --check simulation/local-playwright-harness.mjs
          node --test test/handler.test.mjs test/policy.test.mjs test/interaction-policy.test.mjs test/interaction-executor.test.mjs test/browser-interaction-adapter.test.mjs
      - name: Public read-only Chromium smoke (non-blocking external dependency)
        id: public_smoke
        continue-on-error: true
        working-directory: workers/cloud-browser-agent
        env:
          API1_SCREENSHOT_DIR: /tmp/api1-public-browser-smoke
        run: node simulation/run-public-search-smoke.mjs
      - name: Upload public browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api1-public-browser-smoke
          path: /tmp/api1-public-browser-smoke/
          if-no-files-found: warn
          retention-days: 1
      - name: NASA public link click smoke (non-blocking)
        continue-on-error: true
        working-directory: workers/cloud-browser-agent
        run: node simulation/run-nasa-click-smoke.mjs
      - name: Upload NASA click evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api1-nasa-click-smoke
          path: /tmp/api1-nasa-click-smoke/
          if-no-files-found: warn
          retention-days: 1
      - name: Verify offline interactive four-tab viewer in Chromium
        working-directory: workers/cloud-browser-agent
        run: node --test test/live-browser-viewer.test.mjs test/multi-tab-viewer-ui.e2e.test.mjs
      - name: Upload standalone interactive offline viewer
        uses: actions/upload-artifact@v4
        with:
          name: api1-interactive-offline-four-tab-viewer
          path: workers/cloud-browser-agent/simulation/live-browser-viewer.html
          if-no-files-found: error
          retention-days: 7
      - name: Render isolated API1 viewer demo frames
        working-directory: workers/cloud-browser-agent
        env:
          API1_DEMO_DIR: /tmp/api1-viewer-demo
        run: node simulation/run-wikipedia-viewer-demo.mjs
      - name: Upload isolated API1 viewer demo
        uses: actions/upload-artifact@v4
        with:
          name: api1-offline-viewer-demo
          path: /tmp/api1-viewer-demo/
          if-no-files-found: error
          retention-days: 7
