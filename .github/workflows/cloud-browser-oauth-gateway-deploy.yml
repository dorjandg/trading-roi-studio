name: Cloud Browser Agent — OAuth Gateway Staging Deploy
# Staging-only opt-in enabled after Google account allowlist and isolated OAuth build checks.
# Manual legacy credential-reinstallation path only. Existing staging OAuth
# deployments use the separate secret-preserving code-only workflow.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-browser-chatgpt-stage-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/feature/cloud-browser-agent-phase1' && vars.CLOUD_BROWSER_OAUTH_DEPLOY_ENABLED == 'true'
    environment: browser-agent-staging
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: workers/cloud-browser-chatgpt-gateway
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_ALLOWED_EMAIL: ${{ vars.GOOGLE_ALLOWED_EMAIL }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      BROWSER_AGENT_API_TOKEN: ${{ secrets.BROWSER_AGENT_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm isolated staging readiness
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ vars.BROWSER_AGENT_ACCESS_READY }}" != 'true' ]]; then
            echo "::error::Browser Agent upstream Access is not ready"
            exit 1
          fi
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_ALLOWED_EMAIL CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET BROWSER_AGENT_API_TOKEN; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing staged credential/config $name"; exit 1; fi
          done
          if [[ "$CF_ACCESS_CLIENT_ID" != *.access ]]; then
            echo "::error::Cloudflare Access service Client ID format invalid"
            exit 1
          fi
          # Allow accidental surrounding whitespace on pasted client IDs; do not print the value.
          GOOGLE_CLIENT_ID="$(printf '%s' "$GOOGLE_CLIENT_ID" | tr -d '\\r\\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [[ "$GOOGLE_CLIENT_ID" != *.apps.googleusercontent.com ]]; then
            echo "::error::Google OAuth Client ID does not end with .apps.googleusercontent.com, even after whitespace normalization. Check that the Client ID, not Client Secret, was saved in GOOGLE_CLIENT_ID."
            exit 1
          fi
      - name: Install dependencies, validate and test
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test
          npm run build
      - name: Deploy isolated OAuth staging Worker
        shell: bash
        run: npx wrangler deploy --var "GOOGLE_ALLOWED_EMAIL:$GOOGLE_ALLOWED_EMAIL"
      - name: Install staging OAuth Google credentials securely
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID --name cloud-browser-chatgpt-stage
          printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET --name cloud-browser-chatgpt-stage
      - name: Install protected Browser Agent upstream credentials securely
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CF_ACCESS_CLIENT_ID" | npx wrangler secret put CF_ACCESS_CLIENT_ID --name cloud-browser-chatgpt-stage
          printf '%s' "$CF_ACCESS_CLIENT_SECRET" | npx wrangler secret put CF_ACCESS_CLIENT_SECRET --name cloud-browser-chatgpt-stage
          printf '%s' "$BROWSER_AGENT_API_TOKEN" | npx wrangler secret put BROWSER_AGENT_API_TOKEN --name cloud-browser-chatgpt-stage
      - name: Finish
        run: echo "Isolated OAuth staging deployment completed. OAuth browser sign-in must be tested before custom MCP connection." >> "$GITHUB_STEP_SUMMARY"
