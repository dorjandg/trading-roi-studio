name: Finance MCP controlled-write guard tests
on:
  push:
    branches:
      - feature/ai-control-api-phase1
    paths:
      - 'workers/finance-mcp-gateway-stage/src/write-guards.js'
      - 'workers/finance-mcp-gateway-stage/src/write-approval.js'
      - 'workers/finance-mcp-gateway-stage/src/write-plan.js'
      - 'workers/finance-mcp-gateway-stage/src/approval-request.js'
      - 'workers/finance-mcp-gateway-stage/test/write-guards.test.mjs'
      - 'workers/finance-mcp-gateway-stage/test/write-approval.test.mjs'
      - 'workers/finance-mcp-gateway-stage/test/write-plan.test.mjs'
      - 'workers/finance-mcp-gateway-stage/test/approval-request.test.mjs'
      - 'workers/finance-mcp-gateway-stage/test/atomic-write-sqlite.test.py'
      - '.github/workflows/finance-mcp-write-guards.yml'
  pull_request:
    paths:
      - 'workers/finance-mcp-gateway-stage/src/write-guards.js'
      - 'workers/finance-mcp-gateway-stage/test/write-guards.test.mjs'
jobs:
  guard-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run pure write guard tests without database access
        run: node --experimental-default-type=module --test workers/finance-mcp-gateway-stage/test/*.test.mjs

      - name: Test isolated SQLite atomic transaction rollback
        run: python3 workers/finance-mcp-gateway-stage/test/atomic-write-sqlite.test.py
