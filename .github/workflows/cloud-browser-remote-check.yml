name: Cloud Browser Agent — Cloudflare Remote Browser Check

on:
  push:
    branches:
      - feature/cloud-browser-agent-phase1
    paths:
      - ".github/workflows/cloud-browser-remote-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-check:
    if: github.ref == 'refs/heads/feature/cloud-browser-agent-phase1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: browser-agent-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify one real Cloudflare Browser Run request
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          response_file="$RUNNER_TEMP/browser-response.json"
          http=$(curl --silent --show-error --max-time 75 \
            -o "$response_file" -w '%{http_code}' \
            -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/browser-rendering/markdown" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://trading-roi-studio.pages.dev/"}')
          if [[ "$http" != "200" ]]; then
            echo "::error::Remote browser returned HTTP $http (response withheld to protect account data)"
            exit 1
          fi
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(x.success!==true||typeof x.result!=="string"||x.result.length<10)process.exit(1); console.log("Cloudflare remote browser request succeeded")' "$response_file"
          echo "Real Cloudflare Browser Run completed one authorized read-only request." >> "$GITHUB_STEP_SUMMARY"
