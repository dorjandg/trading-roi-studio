name: Cloud Browser Agent — Staging Deploy

on:
  push:
    branches:
      - feature/cloud-browser-agent-phase1
    paths:
      - "workers/cloud-browser-agent/**"
      - ".github/workflows/cloud-browser-deploy-stage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-agent-stage-deployment
  cancel-in-progress: false

jobs:
  deploy:
    # Deployment is opt-in and isolated from Finance Hub.
    if: github.ref == 'refs/heads/feature/cloud-browser-agent-phase1' && vars.BROWSER_AGENT_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: browser-agent-staging
    defaults:
      run:
        working-directory: workers/cloud-browser-agent
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BROWSER_AGENT_API_TOKEN: ${{ secrets.BROWSER_AGENT_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify required credentials are configured
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$BROWSER_AGENT_API_TOKEN" ]]; then
            echo "::error::Missing deployment secrets. Configure CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and BROWSER_AGENT_API_TOKEN."
            exit 1
          fi
          if [[ "${{ vars.BROWSER_AGENT_ACCESS_READY }}" != "true" ]]; then
            echo "::error::Cloudflare Access must be configured for the staging Worker before deployment."
            exit 1
          fi
      - name: Install cloud browser dependencies
        run: npm install --no-audit --no-fund
      - name: Validate code and run tests
        run: |
          node --check src/index.js
          node --check src/handler.mjs
          node --check src/policy.mjs
          npm test
      - name: Deploy isolated staging Worker
        run: npx wrangler deploy
      - name: Set Worker bearer-token secret
        shell: bash
        run: printf '%s' "$BROWSER_AGENT_API_TOKEN" | npx wrangler secret put AGENT_API_TOKEN --name cloud-browser-agent-stage
      - name: Complete
        run: echo "Staging deployment completed. Browser inspection and screenshots require separate runtime smoke tests." >> "$GITHUB_STEP_SUMMARY"
