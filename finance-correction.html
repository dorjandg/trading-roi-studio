<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finance Hub — Confirm transaction correction</title>
<style>body{font:16px system-ui,sans-serif;max-width:580px;margin:2rem auto;padding:0 1rem;background:#101827;color:#f5f7fa}label{display:block;margin:1rem 0}input,select,button{box-sizing:border-box;width:100%;padding:.75rem;font:inherit;border-radius:8px;border:1px solid #64748b}button{cursor:pointer;margin:.75rem 0;background:#2563eb;color:white}button:disabled{opacity:.5;cursor:not-allowed}.note{color:#cbd5e1}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1e293b;padding:1rem;border-radius:8px}</style></head>
<body><h1>Transaction correction</h1><p class="note">Sign in to Finance Hub first. Only a single description, category or provider can be corrected. Financial amounts and reporting holds cannot be edited here.</p>
<form id="form">
<label>Transaction ID<input name="transaction_id" required pattern="[a-fA-F0-9-]{36}" autocomplete="off"></label>
<label>Field<select name="field"><option value="description">Description</option><option value="category">Category</option><option value="provider">Provider</option></select></label>
<label>Current value<input name="expected_value" autocomplete="off"></label>
<label>New value<input name="new_value" required maxlength="300" autocomplete="off"></label>
<button type="submit">Preview correction</button></form>
<section id="review" hidden><h2>Review exact change</h2><pre id="details"></pre><label><input id="confirm" type="checkbox" style="width:auto"> I confirm this exact correction</label><button id="save" disabled>Save correction</button></section>
<pre id="status" role="status" aria-live="polite"></pre>
<script>
const form=document.getElementById("form"),review=document.getElementById("review"),status=document.getElementById("status"),details=document.getElementById("details"),confirmBox=document.getElementById("confirm"),save=document.getElementById("save");
let proposal=null;
const endpoint=resource=>"/api/finance?resource="+encodeURIComponent(resource);
async function api(resource,body){const res=await fetch(endpoint(resource),{method:"POST",headers:{"content-type":"application/json"},credentials:"same-origin",body:JSON.stringify(body)});const data=await res.json();if(!res.ok)throw Error(data.error||"Request failed");return data}
form.addEventListener("submit",async e=>{e.preventDefault();proposal=null;review.hidden=true;save.disabled=true;confirmBox.checked=false;status.textContent="Checking current snapshot...";
try{const meta=await fetch(endpoint("snapshot-meta"),{credentials:"same-origin"});if(!meta.ok)throw Error("Sign in to Finance Hub");const {revision}=await meta.json();const values=Object.fromEntries(new FormData(form));const result=await api("transaction-change-preview",{...values,expected_revision:revision});proposal={transaction_id:result.transaction_id,field:result.field,expected_revision:result.revision,expected_value:result.before,new_value:result.after};details.textContent=JSON.stringify(proposal,null,2);review.hidden=false;status.textContent="Review the change, then confirm."}catch(err){status.textContent=err.message}});
confirmBox.addEventListener("change",()=>{save.disabled=!confirmBox.checked||!proposal});
save.addEventListener("click",async()=>{if(!confirmBox.checked||!proposal)return;save.disabled=true;status.textContent="Saving...";
try{const result=await api("transaction-change-save",{...proposal,confirmed:true});status.textContent="Saved at revision "+result.revision+". Backup ID: "+result.backup_id;proposal=null;review.hidden=true}
catch(err){status.textContent="Not saved: "+err.message+". Preview again before retrying.";proposal=null;review.hidden=true}});
</script></body></html>
